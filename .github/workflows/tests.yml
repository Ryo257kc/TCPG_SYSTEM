name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  encoding:
    runs-on: windows-latest
    name: Encoding Guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run repository encoding guard
        shell: pwsh
        run: ./scripts/check-repo-encoding.ps1 -Root .

  regression-guard:
    runs-on: ubuntu-latest
    name: Critical Regression Guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run critical regression guard tests
        run: vendor/bin/phpunit tests/Unit/CriticalRegressionGuardTest.php
